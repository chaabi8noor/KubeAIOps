apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "capacity-api.fullname" . }}-test-connection"
  labels:
    app.kubernetes.io/name: capacity-api-test
    app.kubernetes.io/component: capacity-test
    app.kubernetes.io/part-of: kubeaiops
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health-check
      image: busybox:1.37.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -ec
        - wget -qO- http://{{ include "capacity-api.fullname" . }}:{{ .Values.service.port }}/health/ready | grep -q '"status":"ok"'

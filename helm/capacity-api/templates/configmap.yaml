apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "capacity-api.configMapName" . }}
  labels:
    {{- include "capacity-api.labels" . | nindent 4 }}
data:
  PROMETHEUS_URL: {{ .Values.config.prometheusUrl | quote }}
  FORECAST_HORIZON_SECONDS: {{ .Values.config.forecastHorizonSeconds | quote }}
  MIN_REPLICAS: {{ .Values.config.minReplicas | quote }}
  MAX_REPLICAS: {{ .Values.config.maxReplicas | quote }}
  MODEL_PATH: {{ .Values.config.modelPath | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
